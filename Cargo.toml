[package]
name = "dakoku"
version = "0.1.0"
edition = "2024"
description = "リポジトリごとに作業時間を記録する打刻CLI"
repository = "https://github.com/dachi023/dakoku"
license = "MIT OR Apache-2.0"
# 自分用のツールなので crates.io には公開しない
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"
